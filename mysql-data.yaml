architecture: replication
primary:
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 8Gi
secondary:
  replicaCount: 2
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 8Gi
auth:
  existingSecret: mysql-secrets
  rootPasswordKey: rootPassword
  usernameKey: username
  passwordKey: password
  databaseKey: database
namespace: db
